replicaCount: 2

image:
  repository: docker.io/nitace/globallyhub-app
  tag: "357299f6fd4263281d61572fb2ca1b5d4c96963d"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: globallyhub-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}
